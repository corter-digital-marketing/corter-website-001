<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" role="img" aria-label="Corter Digital">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Blue D arc (opens left, curves right) -->
  <path d="M241 126 A68 68 0 1 1 241 214"
        fill="none" stroke="#044fca" stroke-width="36" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Black C arc (opens right, curves left) -->
  <path d="M259 126 A68 68 0 1 0 259 214"
        fill="none" stroke="#111111" stroke-width="36" stroke-linecap="round"/>

  <!-- CORTER -->
  <text x="250" y="338"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="82"
        fill="#111111"
        letter-spacing="5">CORTER</text>

  <!-- DIGITAL -->
  <text x="257" y="406"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700"
        font-size="34"
        fill="#044fca"
        letter-spacing="20">DIGITAL</text>
</svg>
