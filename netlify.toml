[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Permanent redirects from the old site's .html URLs (keeps search rankings) ──
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/websites.html"
  to = "/websites"
  status = 301
  force = true

[[redirects]]
  from = "/social-media.html"
  to = "/social-media"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio"
  status = 301
  force = true

[[redirects]]
  from = "/learn.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/learn"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/learn/*"
  to = "/"
  status = 301
  force = true

# Courses are paused. Remove this redirect when src/pages/courses.astro is restored.
[[redirects]]
  from = "/courses"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/"
  status = 301
  force = true

# ── Caching: fingerprinted build assets can be cached forever ──
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
